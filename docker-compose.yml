services:
  postgres:
    image: postgres:16
    container_name: forgeml_postgres
    environment:
      POSTGRES_USER: forgeml
      POSTGRES_PASSWORD: forgeml
      POSTGRES_DB: forgeml
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: forgeml_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: forgeml_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio_init:
    image: minio/mc:latest
    container_name: forgeml_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/forgeml-datasets || true;
      mc mb -p local/forgeml-artifacts || true;
      mc ls local;
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: forgeml_mlflow
    depends_on:
      - minio
      - minio_init
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root s3://forgeml-artifacts/mlflow
    ports:
      - "5000:5000"

  prefect_server:
    image: prefecthq/prefect:2.16.5-python3.11
    container_name: forgeml_prefect_server
    depends_on:
      - postgres
    environment:
      PREFECT_API_URL: http://prefect_server:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://forgeml:forgeml@postgres:5432/forgeml
    command: prefect server start --host 0.0.0.0 --port 4200
    ports:
      - "4200:4200"

  prefect_worker:
    image: prefecthq/prefect:2.16.5-python3.11
    container_name: forgeml_prefect_worker
    depends_on:
      - prefect_server
    environment:
      PREFECT_API_URL: http://prefect_server:4200/api
    command: >
      /bin/sh -c "
      prefect work-pool create -t process forgeml-pool || true;
      prefect worker start -p forgeml-pool;
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: forgeml_prometheus
    volumes:
      - ./services/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: forgeml_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: forgeml_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - minio
      - mlflow
    volumes:
      - .:/app

volumes:
  pg_data:
  minio_data:
  grafana_data: